# Configuracao do backend — VERSIONADO DE PROPOSITO.
# Nao contem segredos: as credenciais vem de variaveis de ambiente
#   DB_URL, DB_USER, DB_PASSWORD   (Render: Environment -> Environment Variables)
#
# Sem este ficheiro o Spring Boot nao arranca:
#   "Failed to configure a DataSource: 'url' attribute is not specified"
# O application-example.properties nao serve para isto — o Spring Boot nao o le.
#
# Overrides locais com credenciais reais: criar application-local.properties (ignorado
# pelo git) e arrancar com  SPRING_PROFILES_ACTIVE=local.
# NUNCA escrever passwords reais neste ficheiro.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vendanza}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Configuracoes de desempenho (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=540000

# Otimizacao Hibernate
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Limite de tamanho para permitir imagens Base64
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Porta dinamica (Render, Railway, etc.)
server.port=${PORT:8080}
