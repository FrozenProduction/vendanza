# Modelo de configuração do backend — copiar para application.properties e ajustar.
# O application.properties NÃO vai para o repositório (ver .gitignore): as credenciais são
# fornecidas por variáveis de ambiente.
#
#   cp application-example.properties application.properties
#   export DB_URL=jdbc:postgresql://localhost:5432/vendanza
#   export DB_USER=postgres
#   export DB_PASSWORD=...
#
# Os valores por omissão abaixo apontam para um PostgreSQL local e não contêm segredos.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vendanza}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Configurações de desempenho (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=540000

# Otimização Hibernate
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Limite de tamanho para permitir imagens Base64
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Porta dinâmica (Render, Railway, etc.)
server.port=${PORT:8080}
